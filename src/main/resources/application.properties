# 本地事件投递流水线配置（全部状态为进程内模拟）
spring.application.name=event-outbox-pipeline-java

# 默认消费者组
outbox.pipeline.consumer-group=default-group
# 最大处理尝试次数（含首次；1 表示不重试，首次失败即进死信区）
outbox.pipeline.max-attempts=3
# 指数退避：初始 100ms，倍数 2.0，上限 5s
outbox.pipeline.initial-backoff=100ms
outbox.pipeline.backoff-multiplier=2.0
outbox.pipeline.max-backoff=5s
# 并发消费工作线程数
outbox.pipeline.worker-threads=4
# 兜底扫描周期（正常入队/重试到期会立即唤醒，不等待该周期）
outbox.pipeline.poll-interval=200ms
