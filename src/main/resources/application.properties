# 进程内事件管道配置（com.github.h3yow.eventoutboxpipelinejava.config.EventPipelineProperties）
event.outbox.partition-count=4
event.outbox.worker-count=4
event.outbox.max-attempts=3
event.outbox.initial-backoff=50ms
event.outbox.max-backoff=2s
# 默认不自动启动消费，由应用显式注入 EventPipeline 并调用 start()
event.outbox.auto-start=false
